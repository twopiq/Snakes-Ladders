      <stop offset="0" stop-color="#16294A"/><stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="34%" cy="60%" r="52%">
      <stop offset="0" stop-color="#38BDF8" stop-opacity=".24"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
